services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev_pwd
      POSTGRES_DB: ai_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d ai_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
